
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Customer Support | Assistente Virtual</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2ff;
  color: #172033;
}

header {
  background: #172554;
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0 0 8px;
}

header p {
  color: #cbd5e1;
  margin: 0;
}

.container {
  max-width: 650px;
  margin: 35px auto;
  padding: 15px;
}

.chat {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 5px 25px #0002;
}

.chat-title {
  padding: 18px;
  font-weight: bold;
  border-bottom: 1px solid #eee;
}

.messages {
  height: 380px;
  overflow-y: auto;
  padding: 18px;
}

.message {
  padding: 13px;
  border-radius: 12px;
  margin-bottom: 12px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
}

.bot {
  background: #e8eefc;
  margin-right: auto;
}

.user {
  background: #2563eb;
  color: white;
  margin-left: auto;
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 15px;
  border-top: 1px solid #eee;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.note {
  text-align: center;
  color: #64748b;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>
  <h1>🤖 AI Customer Support</h1>
  <p>Assistente Virtual de Atendimento</p>
</header>

<div class="container">

  <div class="chat">

    <div class="chat-title">
      💬 Atendimento Virtual
    </div>

    <div class="messages" id="messages">

      <div class="message bot">
        Olá! Seja bem-vindo(a)! 👋

        Sou seu assistente virtual.
        Como posso ajudar hoje?
      </div>

    </div>

    <div class="input-area">

      <input
        id="userInput"
        type="text"
        placeholder="Digite sua mensagem..."
      >

      <button onclick="sendMessage()">
        Enviar
      </button>

    </div>

  </div>

  <p class="note">
    Personal AI Project | GitHub Portfolio
  </p>

</div>

<script>

function getResponse(message) {

  const text = message.toLowerCase();

  if (
    text.includes("pedido") ||
    text.includes("entrega") ||
    text.includes("atrasado")
  ) {
    return "Sinto muito pelo atraso! 📦\n\nVocê pode verificar o status da entrega utilizando o código de rastreamento fornecido pela loja.\n\nSe precisar, procure o atendimento humano.";
  }

  if (
    text.includes("pagamento") ||
    text.includes("paguei") ||
    text.includes("cobrança")
  ) {
    return "Posso ajudar com sua dúvida sobre pagamento! 💳\n\nVerifique o status no aplicativo ou site oficial da empresa. Se houver algum problema, entre em contato com o suporte responsável.";
  }

  if (
    text.includes("reclamação") ||
    text.includes("insatisfeito") ||
    text.includes("problema")
  ) {
    return "Entendo sua insatisfação e sinto muito pela experiência. ❤️\n\nGostaria de entender melhor o que aconteceu para orientar você.";
  }

  if (
    text.includes("olá") ||
    text.includes("oi") ||
    text.includes("bom dia")
  ) {
    return "Olá! 😊 Como posso ajudar você hoje?";
  }

  return "Obrigado por entrar em contato!\n\nPoderia explicar um pouco melhor sua dúvida? Assim posso orientar você da melhor maneira possível.";
}

function sendMessage() {

  const input = document.getElementById("userInput");

  const messages = document.getElementById("messages");

  const text = input.value.trim();

  if (text === "") return;

  const userMessage = document.createElement("div");

  userMessage.className = "message user";

  userMessage.textContent = text;

  messages.appendChild(userMessage);

  input.value = "";

  const botMessage = document.createElement("div");

  botMessage.className = "message bot";

  botMessage.textContent = getResponse(text);

  messages.appendChild(botMessage);

  messages.scrollTop = messages.scrollHeight;

}

document.getElementById("userInput")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

</script>

</body>
</html>
