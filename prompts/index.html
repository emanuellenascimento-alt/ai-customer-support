
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Customer Support</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}
header {
  background: #172554;
  color: white;
  padding: 22px;
  text-align: center;
}
header h1 { margin: 0 0 7px; font-size: 23px; }
header p { margin: 0; color: #cbd5e1; }
.container {
  max-width: 650px;
  margin: 35px auto;
  padding: 15px;
}
.chat {
  background: white;
  border-radius: 15px;
  box-shadow: 0 5px 25px #00000012;
  overflow: hidden;
}
.chat-title {
  padding: 18px;
  border-bottom: 1px solid #e2e8f0;
  font-weight: bold;
}
.messages {
  height: 370px;
  overflow-y: auto;
  padding: 18px;
}
.message {
  padding: 12px 15px;
  border-radius: 12px;
  margin-bottom: 13px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
}
.bot {
  background: #e8eefc;
  margin-right: auto;
}
.user {
  background: #172554;
  color: white;
  margin-left: auto;
}
.input-area {
  display: flex;
  gap: 8px;
  padding: 15px;
  border-top: 1px solid #e2e8f0;
}
input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 15px;
}
button {
  border: none;
  background: #2563eb;
  color: white;
  padding: 12px 18px;
  border-radius: 9px;
  cursor: pointer;
}
button:hover { background: #1d4ed8; }
.note {
  text-align: center;
  font-size: 12px;
  color: #64748b;
  margin-top: 18px;
}
</style>
</head>
<body>

<header>
  <h1>🤖 AI Customer Support</h1>
  <p>Virtual Customer Service Assistant</p>
</header>

<div class="container">
  <div class="chat">
    <div class="chat-title">
      Atendimento virtual
    </div>

    <div class="messages" id="messages">
      <div class="message bot">
        Olá! Seja bem-vindo(a)! 👋
        Sou seu assistente virtual.
        Como posso ajudar hoje?
      </div>
    </div>

    <div class="input-area">
      <input id="userInput"
        placeholder="Digite sua mensagem..."
        onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <p class="note">
    Personal AI project | Interactive demonstration
  </p>
</div>

<script>
function getResponse(message) {
  const text = message.toLowerCase();

  if (text.includes("pedido") ||
      text.includes("entrega") ||
      text.includes("atrasado")) {
    return "Sinto muito pelo atraso! 📦\n\nVocê pode verificar o status da entrega utilizando o código de rastreamento fornecido pela loja.\n\nNão compartilhe senhas ou dados bancários. Se precisar, procure o atendimento humano.";
  }

  if (text.includes("pagamento") ||
      text.includes("paguei") ||
      text.includes("cobrança")) {
    return "Posso ajudar com sua dúvida sobre pagamento! 💳\n\nVerifique o status no aplicativo ou site oficial da empresa. Se o pagamento não aparecer, entre em contato com o suporte responsável.";
  }

  if (text.includes("reclamação") ||
      text.includes("insatisfeito") ||
      text.includes("problema")) {
    return "Entendo sua insatisfação e sinto muito pela experiência. ❤️\n\nGostaria de entender melhor o que aconteceu para orientar você da melhor maneira possível.";
  }

  if (text.includes("olá") ||
      text.includes("oi") ||
      text.includes("bom dia")) {
    return "Olá! 😊 Como posso ajudar você hoje?";
  }

  return "Obrigado por entrar em contato!\n\nAinda não tenho informações suficientes para responder com precisão. Poderia explicar um pouco melhor sua dúvida?\n\nSe necessário, recomendo procurar um atendente humano.";
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const messages = document.getElementById("messages");
  const text = input.value.trim();

  if (!text) return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;
  messages.appendChild(userMessage);

  input.value = "";

  const botMessage = document.createElement("div");
  botMessage.className = "message bot";
  botMessage.textContent = getResponse(text);
  messages.appendChild(botMessage);

  messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
